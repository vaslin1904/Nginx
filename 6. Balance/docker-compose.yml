version: '3'

services:
  debug-white:
    image: vscoder/webdebugger
    container_name: debug-white
    restart: unless-stopped
    environment:
      APP_DELAY: 0
      APP_PORT: 8080
      APP_BGCOLOR: white
    ports:
      - "9000:8080"
    networks:
      - app-network

  debug-blue:
    image: vscoder/webdebugger
    container_name: debug-blue
    restart: unless-stopped
    environment:
      APP_DELAY: 0
      APP_PORT: 8080
      APP_BGCOLOR: skyblue
    ports:
      - "9001:8080"
    networks:
      - app-network

  debug-green:
    image: vscoder/webdebugger
    container_name: debug-green
    restart: unless-stopped
    environment:
      APP_DELAY: 0
      APP_PORT: 8080
      APP_BGCOLOR: limegreen
    ports:
      - "9002:8080"
    networks:
      - app-network
  
  debug-gold:
    image: vscoder/webdebugger
    container_name: debug-gold
    restart: unless-stopped
    environment:
      APP_DELAY: 0
      APP_PORT: 8080
      APP_BGCOLOR: gold
    ports:
      - "9003:8080"
    networks:
      - app-network

  webserver:
    image: docker.angie.software/angie:1.11.4-ubuntu
    container_name: webserver_balance
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/vasy/angie_balanc/angie.conf:/etc/angie/angie.conf:ro
      - /home/vasy/angie_balanc/http.d:/etc/angie/http.d:ro
      - /home/vasy/angie_balanc/acme:/var/lib/angie/acme:rw
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
