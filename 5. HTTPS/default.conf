acme_client rsa https://acme-v02.api.letsencrypt.org/directory key_type=rsa;
acme_client ecdsa https://acme-v02.api.letsencrypt.org/directory;
#____________________________________________________________
#Настройка HTTP для обновления сертификатов,
   # а также для перенаправления на HTTPS
server {
      
      listen 80 default_server reuseport;
      server_name mystend.strangled.net;

      location /.well-known/acme-challenge/ {
          root /var/www/acme;
      }

      location / {
         return 301 https://$host$request_uri;
      }

}
#__________________________________________________________
# Настройка HTTPS
server {
#reuseport- распределение новых подключений по workers
 #через механизмы ядра, открытие нескольких экземпляров сокета
 #подключение протокола quic для HTTP/3 
      listen 443 ssl reuseport;
      listen 443 quic reuseport;

      server_name  mystend.strangled.net;
#Подключение HTTP/2, HTTP/3
      http2 on;
      http3 on;

#Настройка получения сертификатов
   
      acme	rsa;
      acme	ecdsa;

      ssl_certificate	        $acme_cert_rsa;
      ssl_certificate_key 	$acme_cert_key_rsa;
      ssl_certificate		$acme_cert_ecdsa;
      ssl_certificate_key	$acme_cert_key_ecdsa;
      
#По умолчанию:
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;      
      ssl_session_tickets on;
#Оптимизация HTTP/2
      http2_max_concurrent_streams 128;
      http2_chunk_size 8k;
#Настройка HTTP/3
      add_header Alt-Svc 'h3=":443"; ma=86400';
      http3_max_concurrent_streams 128;

       #access_log  /var/log/angie/host.access.log  main;
   
        root   /var/www/html;
        index  index.php index.htm index.html;
    
    
    location / {
      try_files $uri $uri/ /index.php$is_args$args;
      
    }

    #Location - регулярные выражения. Обработка картинок. Поиск по регуляркt.Кэширование на 30 дней
    location ~* \.(?:jpeg|jpg|png|gif|svg|css|webp)$ {
         log_not_found off;
   }


    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504 404 /error/index.html;
    
    location = /error/index.html {
        internal;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    location ~ \.php$ {
#        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
   #Время соединения с бэкендом
     #Если за отведённое время сервер не передаст новые данные, соединение разрывается.
        fastcgi_read_timeout 10s;
     #Если FastCGI-сервер не примет данные в течение этого времени, соединение закрывается.
        fastcgi_send_timeout 10s;
     #Настройка серверного кэширования
         fastcgi_cache one;
         fastcgi_cache_valid 200 10m;
         fastcgi_cache_lock on;
         fastcgi_cache_min_uses 2;
         fastcgi_ignore_headers "Cache-Control" "Expires" "Set-Cookie";
         fastcgi_cache_background_update on;
      #Проверка работы серверного кэширования
         add_header X-cache-status $upstream_cache_status;
         add_header X-cache-key $scheme$host$uri;
      #Сжатие текста
         gzip on;
         gzip_static on;
         gzip_types text/plain text/css text/xml application/javascript applica>
         gzip_comp_level 3;
         gzip_proxied any;
         gzip_min_length 1000;
         gzip_vary on;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with angie's one
    #
    location ~ /\.ht {
        deny  all;
    }
    location ~* \.(env|git|htaccess|sql|bak|backup|log)$ {
        deny all;
        return 403;
    }

    location =/p8s {
      prometheus all;
    } 
}

