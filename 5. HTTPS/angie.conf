user  angie;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/angie/error.log notice;
pid        /run/angie/angie.pid;

events {
    worker_connections  65536;
}


http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format extended '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" rt="$request_time" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'h="$host" sn="$server_name" ru="$request_uri" u="$uri" '
                        'ucs="$upstream_cache_status" ua="$upstream_addr" us="$upstream_status" '
                        'uct="$upstream_connect_time" urt="$upstream_response_time"';
#Повышение уровня лога с main на info
    error_log  /var/log/angie/error.log  info;
      #senfile Позволяет без затрат процессора, с минимальным копированием через RAM отдавать файлы

#Оптимизация SSL cоединений - кэширование. 
# В 1 мегабайт кэша помещается около 4000 сессий.
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 5m;


    tcp_nopush on;
    # данные отправляются немедленно после получения от приложения, 
      #что снижает задержку (латентность), но увеличивает общее количество пакетов в сети. 
    tcp_nodelay on;

# По умолчанию  keepalive_timeout  65;
#определяет, как долго сервер будет держать бездействующее постоянное (keep-alive) соединение открытым
# в ожидании новых запросов от клиента. Если за это время запросов не поступит, сервер закроет соединение,
    keepalive_timeout 120;
#позволяет нескольким HTTP-запросам обрабатываться по одному TCP-соединению,
# вместо того чтобы открывать и закрывать его для каждого запроса.
#может привести к чрезмерному потреблению памяти
    keepalive_requests 1000; 

#Снижает нагрузку на диск и ядро ОС когда сервер часто отдаёт статические файлы
#и при этом активно проверяет метаданные (существование, права, время модификации).
    open_file_cache max=10000 inactive=60s;
#Определяет время, через которое следует проверять актуальность информации
# об элементе в open_file_cache.
    open_file_cache_valid 30s;
#Задает минимальное число обращений к файлу в течение времени,
# заданного параметром inactive директивы open_file_cache, необходимых для того, чтобы дескриптор файла оставался открытым в кэше.
    open_file_cache_min_uses 2; 
#Серверное кэширование http
    fastcgi_cache_valid 1m;
    fastcgi_cache_key $scheme$request_uri;
    fastcgi_cache_path /cache levels=1:2 keys_zone=one:10m:file=/etc/angie/cache.state inactive=24h max_size=800m;
#gzip  on;
#Настройка получения сертификата HTTP
    resolver 127.0.0.11 ipv6=off;

    include /etc/angie/http.d/*.conf;
    include prometheus_all.conf;
}

